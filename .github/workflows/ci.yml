name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest -v

      - name: dbt(fixture データで seed / run / test)
        run: |
          mkdir -p data/raw
          cp tests/fixtures/sample_response.json data/raw/
          python -m pipeline.load --skip-fetch
          cd dbt_project
          export DBT_PROFILES_DIR=.
          dbt seed
          dbt run
          dbt test
