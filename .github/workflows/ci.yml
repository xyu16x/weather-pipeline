name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt && pip install -e .

      - name: pytest
        run: pytest -v

      - name: dbt build(fixture データ)
        run: |
          mkdir -p data/raw
          cp tests/fixtures/sample_response.json data/raw/
          python -m pipeline.load --skip-fetch
          cd dbt_project
          export DBT_PROFILES_DIR=.
          dbt build
